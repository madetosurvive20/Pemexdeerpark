<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Deer Park Report — Independent community hub for the Pemex Deer Park refinery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#111e30"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5a800"/>
      <stop offset="100%" stop-color="#ffc235"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- top bar (ticker reference) -->
  <rect x="0" y="0" width="1200" height="14" fill="#f5a800"/>
  <!-- skyline silhouettes -->
  <g fill="#f5a800" opacity=".18">
    <rect x="60" y="490" width="40" height="80"/>
    <rect x="110" y="450" width="20" height="120"/>
    <polygon points="140,570 160,420 180,570"/>
    <rect x="190" y="470" width="30" height="100"/>
    <rect x="230" y="500" width="50" height="70"/>
    <rect x="290" y="450" width="20" height="120"/>
    <rect x="320" y="510" width="40" height="60"/>
    <polygon points="370,570 395,400 420,570"/>
    <rect x="430" y="490" width="30" height="80"/>
    <rect x="470" y="460" width="20" height="110"/>
    <rect x="500" y="520" width="60" height="50"/>
    <rect x="570" y="475" width="35" height="95"/>
    <rect x="615" y="500" width="40" height="70"/>
    <polygon points="665,570 690,425 715,570"/>
    <rect x="725" y="490" width="35" height="80"/>
    <rect x="770" y="465" width="20" height="105"/>
    <rect x="800" y="510" width="55" height="60"/>
    <rect x="865" y="480" width="30" height="90"/>
    <polygon points="905,570 925,415 945,570"/>
    <rect x="955" y="495" width="40" height="75"/>
    <rect x="1005" y="470" width="25" height="100"/>
    <rect x="1040" y="515" width="55" height="55"/>
    <rect x="1105" y="485" width="35" height="85"/>
  </g>
  <!-- water line -->
  <rect x="0" y="568" width="1200" height="62" fill="#0d1625"/>
  <rect x="0" y="568" width="1200" height="2" fill="#f5a800" opacity=".25"/>
  <!-- eyebrow -->
  <text x="80" y="120" font-family="'IBM Plex Mono', monospace" font-size="22" letter-spacing="6" fill="#f5a800" font-weight="500">DEER PARK · TEXAS · INDEPENDENT</text>
  <!-- masthead -->
  <text x="80" y="240" font-family="Georgia, 'Fraunces', serif" font-weight="900" font-size="120" fill="#f0ebe0" letter-spacing="-3">Deer Park</text>
  <text x="80" y="360" font-family="Georgia, 'Fraunces', serif" font-style="italic" font-weight="900" font-size="120" fill="url(#amber)" letter-spacing="-3">Report.</text>
  <!-- subhead -->
  <text x="80" y="430" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" fill="#c7cfdc" font-weight="400">Live air quality · Refinery news · Jobs · Houston Ship Channel</text>
  <!-- right-side stat -->
  <g transform="translate(900,140)">
    <rect x="0" y="0" width="220" height="180" rx="8" fill="#0d1625" stroke="#f5a800" stroke-opacity=".3"/>
    <text x="20" y="42" font-family="'IBM Plex Mono', monospace" font-size="14" letter-spacing="3" fill="#f5a800">DEER PARK AQI</text>
    <text x="20" y="120" font-family="Georgia, 'Fraunces', serif" font-weight="900" font-size="84" fill="#4ade80">42</text>
    <text x="20" y="158" font-family="'IBM Plex Mono', monospace" font-size="18" fill="#4ade80">Good</text>
  </g>
  <!-- domain -->
  <text x="80" y="540" font-family="'IBM Plex Mono', monospace" font-size="22" letter-spacing="3" fill="#9ba6b8">pemexdeerpark.com</text>
</svg>
